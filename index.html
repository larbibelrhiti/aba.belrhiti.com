<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Larbi Alaoui Belrhiti</title>
<meta name="description" content="Book a 30 or 60 minute video call with Larbi Alaoui Belrhiti.">
<meta name="robots" content="noindex">
<style>
  :root { --ink: #14213D; --accent: #C2185B; --bg: #F6F7F9; --card: #FFFFFF; --muted: #5F6B7A; --line: #E3E6EB; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F1F3F5; --bg: #0F1216; --card: #171B21; --muted: #9AA4B2; --line: #262C35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line);
          border-radius: 16px; padding: 32px 24px; text-align: center; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center;
             background: var(--accent); color: #fff; font-weight: 600; font-size: 26px; letter-spacing: .5px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); margin: 4px 0 28px; }
  a.opt { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; text-align: left;
           border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px;
           padding: 16px 18px; margin-top: 12px; transition: border-color .15s, transform .15s; }
  a.opt:hover, a.opt:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .opt b { display: block; font-size: 17px; }
  .opt span { color: var(--muted); font-size: 14px; }
  .opt .go { margin-left: auto; color: var(--accent); font-size: 20px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="avatar" aria-hidden="true">LB</div>
  <h1>Larbi Alaoui Belrhiti</h1>
  <p class="sub">ABA Technology</p>
  <a class="opt" href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0Z6HgPtJoB_PLRq5czz2SQViBEWuDyZuLdxX4KQSqNpmA5ZxCCorXWNu9_Qn_zEcHNJfN0zeTv">
    <div><b>30 min</b><span>Video call · Google Meet</span></div><span class="go" aria-hidden="true">→</span>
  </a>
  <a class="opt" href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ0Y3T2ANGKlzCU91mixkUp2pJShQxTqOPloWno36JdbiyEKD-_QztPWXwzc8EmyDIdKAJY5Ha7d">
    <div><b>60 min</b><span>Video call · Google Meet</span></div><span class="go" aria-hidden="true">→</span>
  </a>
  <footer>Pick a slot on the next page. Times show in your time zone.</footer>
</main>
</body>
</html>
